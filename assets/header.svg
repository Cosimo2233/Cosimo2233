<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Cosimo2233 · Little hardware lab</title>
  <desc id="desc">A cozy dark circuit board with mint traces, warm peach highlights, and a sleepy cream cat resting beside a microchip.</desc>
