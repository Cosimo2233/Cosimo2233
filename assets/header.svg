    <text x="49" y="156" font-size="69" font-weight="700" letter-spacing="-2" fill="#eff5f1">Hi, I'm Cosimo<tspan fill="#f4c58b">.</tspan></text>
    <text x="53" y="198" font-size="20" fill="#b8c9ce">A little code. A little circuit. A lot of curiosity.</text>
