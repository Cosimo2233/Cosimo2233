name: Update contribution snake

on:
  schedule:
    # 04:23 Asia/Shanghai; GitHub schedules run in UTC.
    - cron: '23 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'Cosimo2233/Cosimo2233'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark SVG animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: Cosimo2233
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23c481a7
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23f4c58b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish animations to the output branch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            if (owner !== 'Cosimo2233' || repo !== 'Cosimo2233') {
              throw new Error('This workflow only publishes to Cosimo2233/Cosimo2233.');
            }
            const files = ['github-contribution-grid-snake.svg', 'github-contribution-grid-snake-dark.svg'];
            const tree = files.map(path => ({
              path, mode: '100644', type: 'blob', content: fs.readFileSync(`dist/${path}`, 'utf8')
            }));
            let parent;
            try {
              parent = (await github.rest.git.getRef({ owner, repo, ref: 'heads/output' })).data.object.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const createdTree = await github.rest.git.createTree({ owner, repo, tree });
            if (parent) {
              const previous = await github.rest.git.getCommit({ owner, repo, commit_sha: parent });
              if (previous.data.tree.sha === createdTree.data.sha) {
                core.info('Contribution animations are already up to date.');
                return;
              }
            }
            const commit = await github.rest.git.createCommit({
              owner, repo, message: 'chore: refresh contribution snake',
              tree: createdTree.data.sha, parents: parent ? [parent] : []
            });
            if (parent) {
              await github.rest.git.updateRef({ owner, repo, ref: 'heads/output', sha: commit.data.sha, force: false });
            } else {
              await github.rest.git.createRef({ owner, repo, ref: 'refs/heads/output', sha: commit.data.sha });
            }
